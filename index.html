bg:()=>{const a=[];[[220,262,330],[175,220,262],[196,247,294],[165,208,247]].forEach((c,i)=>{c.forEach((f,k)=>a.push([f,i*2.4+k*.35,1.8,"triangle",.05,0,900]));a.push([c[0]/2,i*2.4,2.2,"sine",.1,0,300])});return a}};
const LEN={tick:.3,sus:2.2,pick:.8,blip:.15,start:1.9,ok:1.8,no:1.9,win:2.7,bg:9.6},ECHO={pick:1,start:1,ok:1,win:1};
function synth(name){const sr=22050,n=Math.ceil(LEN[name]*sr),d=new Float32Array(n);
DEF[name]().forEach(([f,t,du,ty,v,to,lp])=>{const s0=Math.floor(t*sr),ns=Math.floor((du+.02)*sr),amp=Math.min(v*2.2,.6),a=lp?Math.min(1,2*Math.PI*lp/sr):1;let ph=0,y=0;
for(let i=0;i<ns&&s0+i<n;i++){const tt=i/sr,fr=to?f*Math.pow(to/f,Math.min(tt/du,1)):f;ph+=fr/sr;const p=ph%1;let x=ty==="sine"?Math.sin(6.2832*p):ty==="square"?(p<.5?1:-1):ty==="sawtooth"?2*p-1:(p<.5?4*p-1:3-4*p);if(lp){y+=a*(x-y);x=y}
const env=tt<.012?tt/.012:Math.exp(-9.2*(tt-.012)/Math.max(du-.012,.01));if(tt<=du)d[s0+i]+=x*amp*env}});
if(ECHO[name]){const dl=Math.floor(.17*sr);for(let i=n-1;i>=dl;i--)d[i]+=.28*d[i-dl]}
for(let i=0;i<n;i++)d[i]=Math.max(-1,Math.min(1,d[i]));
const b=ac().createBuffer(1,n,sr);b.copyToChannel(d,0);return b}
function play(name,rate){if(muted||!bufs[name])return;try{const c=ac(),t0=Date.now(),go=()=>{if(Date.now()-t0>700)return;const x=c.createBufferSource(),g=c.createGain();x.buffer=bufs[name];if(rate)x.playbackRate.value=rate;g.gain.value=.9;x.connect(g);g.connect(c.destination);x.start(0)};if(c.state==="running")go();else c.resume().then(go).catch(()=>{})}catch(e){}}
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type="playback";const c=ac();if(!unlocked){unlocked=true;const x=c.createBufferSource();x.buffer=c.createBuffer(1,1,22050);x.connect(c.destination);x.start(0);["tick","sus","pick","blip","start","ok","no","win"].forEach(n=>bufs[n]=synth(n));const a=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");const p=a.play();if(p&&p.catch)p.catch(()=>{})}else if(c.state!=="running")c.resume()}catch(e){}}
const SFX={tick:()=>play("tick"),sus:()=>play("sus"),pick:()=>play("pick"),start:()=>play("start"),ok:()=>play("ok"),no:()=>play("no"),win:()=>play("win")};
const BG={s:null,g:null,on(){if(this.s||!unlocked)return;try{const c=ac();if(!bufs.bg)bufs.bg=synth("bg");const s=c.createBufferSource(),g=c.createGain();s.buffer=bufs.bg;s.loop=true;g.gain.value=muted?0:bgv();s.connect(g);g.connect(c.destination);s.start(0);this.s=s;this.g=g}catch(e){}},off(){try{this.s&&this.s.stop()}catch(e){}this.s=null;this.g=null}};
/* voz del teléfono (si el visor lo permite) */
let voiceOn=false,talkI;

let VM=false,vTok=0;const VA=new Audio();VA.preload="auto";

const OK=[["R01","¡Correcto! ¡Eres un genio del tiempo!"],["R02","¡Bingo! Tu línea temporal está intacta."],["R03","¡Exacto! Esa fue fácil, ¿no?"],["R05","¡Tic, tac… perfecto!"],["R06","¡Justo a tiempo, agente!"],["R07","¡Línea temporal protegida!"],["R08","¡Qué memoria! Ni el TVA te la borra."],["R09","¡Eso es! Sigue así."]];
const NO=[["R04","¡Ay, rama equivocada! Esa no era."],["R10","¡Uy! Eso desvía la línea temporal."],["R11","Casi… pero no."],["R12","¡Variante detectada! Esa no era."],["R13","No pasa nada, agente. Sigamos."],["R14","¡Error en el multiverso! Sigamos."]];
const TOUT=[["T01","¡Se acabó el tiempo, agente!"],["T02","¡Tic, tac, tic, tac… tiempo!"],["T03","¡El reloj ganó esta vez!"],["T04","Demasiado lento… esa pregunta se pasó de tiempo."]];

const NEWIDS=[...OK,...NO,...TOUT,...Object.values(K)].map(x=>x[0]).filter(id=>!["R01","R02","R03","R04"].includes(id));
const have=new Set(),lastP={};
const avail=id=>!VM||!NEWIDS.includes(id)||have.has(id);
function probe(id){return new Promise(r=>{const a=new Audio();a.preload="metadata";let d=0;const f=ok=>{if(d)return;d=1;if(ok)have.add(id);r()};a.onloadedmetadata=()=>f(1);a.onerror=()=>f(0);setTimeout(()=>f(0),6000);a.src=vpath(id)})}
function pool(arr,key){const c0=arr.filter(x=>avail(x[0])),c=c0.length?c0:arr,l=c.filter(x=>x[0]!==lastP[key]),a=l.length?l:c,r=a[Math.floor(Math.random()*a.length)];lastP[key]=r[0];return r}
let TM=[];
function stopTimer(){TM.forEach(clearTimeout);TM=[]}
function timeUp(){if(lock)return;lock=true;stopTimer();if(VM)vstop();const g=G,c=G.cur.o.find(o=>o.ok);c.el.classList.add("ok");G.res[G.n]=0;G.st=0;G.ms++;SFX.no();mood("sad");look(0,10);lad();const r=pool(TOUT,"t");say(r[1]);
const go=()=>{if(g===G){G.n++;next()}};
if(VM)setTimeout(()=>vplay(r[0]).then(()=>setTimeout(go,500)),500);else setTimeout(go,2200)}
const INTRO=[["F03","¡Siguiente! Mira con atención."],["F04","Sin presión… bueno, un poquito."],["F05","¡Vamos! El reloj no perdona."]],INTRO0=["F02","¡Bienvenido, agente! Soy la Srta. Minutos. ¡Primera pregunta!"];
function vpath(id){return AUD.base+AUD.dir[id[0]]+"/"+id+AUD.ext}
function vstop(){vTok++;try{VA.pause()}catch(e){}talk(0)}
function vplay(id,onMeta){return new Promise(res=>{if(!VM)return res();const tok=++vTok;let done=false,to;
const fin=()=>{if(done)return;done=true;clearTimeout(to);if(tok!==vTok)return;talk(0);res()};
to=setTimeout(fin,30000);VA.onended=fin;VA.onerror=()=>{console.warn("No se pudo cargar el audio:",vpath(id));fin()};
VA.onloadedmetadata=()=>{if(tok===vTok&&onMeta)onMeta(VA.duration)};
VA.src=vpath(id);VA.muted=muted;const p=VA.play();if(p&&p.then)p.then(()=>{if(tok===vTok&&!done)talk(1)}).catch(e=>{console.warn("Audio bloqueado:",e);fin()})})}
function speak(t){if(!voiceOn||!window.speechSynthesis)return;let st=false;try{speechSynthesis.cancel();setTimeout(()=>{try{speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices(),v=vs.find(v=>/^es[-_]?(MX|US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));u.lang=v?v.lang:"es-MX";if(v)u.voice=v;u.rate=1;u.pitch=1.2;u.onstart=()=>{st=true;speechOK=true;talk(1)};u.onend=u.onerror=()=>talk(0);speechSynthesis.speak(u);setTimeout(()=>{if(!st){speechOK=false;talk(0);$("voice").style.display="none"}},3500)}catch(e){}},160)}catch(e){}}
function speakQ(){const q=G.cur.q;speak(q[0]+". "+G.cur.o.map((o,i)=>"ABCD"[i]+". "+o.t).join(". "))}


$("mute").onclick=()=>{muted=!muted;$("mute").classList.toggle("off",muted);VA.muted=muted;if(BG.g)BG.g.gain.value=muted?0:bgv();if(!muted)SFX.pick()};
/* Srta. Minutos reactiva */
const M={smile:["M76 134Q98 150 122 134Q98 139 76 134Z","#fff"],open:["M70 128Q98 170 128 128Q98 138 70 128Z","#fff"],frown:["M78 144Q98 126 120 144","none"],o:["M90 136Q98 126 106 136Q98 150 90 136Z","#3b1a0c"]};
function mood(m,mouth){const s=$("mascot");s.dataset.m="x";void s.getBoundingClientRect();s.dataset.m=m;const p=M[mouth||({happy:"open",sad:"frown",tense:"o",hint:"smile",idle:"smile"})[m]];$("mouth").setAttribute("d",p[0]);$("mouth").setAttribute("fill",p[1])}
function look(x,y){["pupL","pupR"].forEach(i=>$(i).style.transform="translate("+x+"px,"+y+"px)")}
function lookAt(cx,cy){const r=$("mascot").getBoundingClientRect(),dx=(cx-(r.left+r.width/2))/(innerWidth/2),dy=(cy-(r.top+r.height*.35))/(innerHeight/2);look(Math.max(-1,Math.min(1,dx))*9,Math.max(-1,Math.min(1,dy))*10)}
addEventListener("pointermove",e=>{if(!lock)lookAt(e.clientX,e.clientY)});
addEventListener("pointerdown",e=>{if(!lock)lookAt(e.clientX,e.clientY)},{passive:true});["touchend","click"].forEach(t=>addEventListener(t,unlock,{passive:true}));
function say(t){clearInterval(tI);const b=$("say");b.textContent="";let i=0;tI=setInterval(()=>{b.textContent=t.slice(0,++i);if(!speechOK&&!VM&&i%3===0&&/\S/.test(t[i-1]))play("blip",.8+Math.random()*.7);if(i>=t.length)clearInterval(tI)},26)}
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");$("app").classList.toggle("playing",id==="s-q")}

function lad(){$("lad").innerHTML=G.set.map((_,i)=>`<i class="${G.res[i]===1?"g":G.res[i]===0?"r":i===G.n?"cur":""}"></i>`).join("")}
function idleWatch(){stopTimer();const g=G,nn=G.n,t=$("tb"),live=()=>g===G&&g.n===nn&&!lock;
t.className="";t.style.transition="none";t.style.width="100%";void t.offsetWidth;t.style.transition="width "+TIEMPO+"s linear";t.style.width="0%";
TM.push(setTimeout(()=>{if(!live())return;const r=pool(NUDGE,"n");mood("tense");say(r[1]);vplay(r[0]);setTimeout(()=>live()&&mood("idle"),2500)},TIEMPO*400));
TM.push(setTimeout(()=>{if(!live())return;t.className="hot";mood("tense");say("¿Sigues ahí, agente? ¡El tiempo corre!");look(0,-6);vplay("F07");setTimeout(()=>live()&&mood("idle"),2500)},(TIEMPO-5)*1000));
TM.push(setTimeout(()=>{if(live())timeUp()},TIEMPO*1000))}
function start(){ac();if(VM)vstop();SFX.start();BG.on();const pd=(p,i)=>p+String(i+1).padStart(2,"0");const s=sh(W.map((x,i)=>[...x,"WandaVision",pd("PW",i)])).slice(0,5).concat(sh(A.map((x,i)=>[...x,"Agatha All Along",pd("PA",i)])).slice(0,5));G={set:sh(s),n:0,ok:0,res:[],st:0,ms:0};stopTimer();mood("happy");setTimeout(next,900)}
function next(){if(G.n>=10)return end();lock=false;const g=G,nn=G.n,q=G.set[G.n];G.cur={q,o:sh(q.slice(1,5).map((t,i)=>({t,ok:i===0})))};lad();
const tb=$("tb");tb.className="";tb.style.transition="none";tb.style.width="100%";
$("tag").textContent="Pregunta "+(G.n+1)+" de 10 · "+q[5];$("q").textContent=VM?"":q[0];$("ans").innerHTML="";
G.cur.o.forEach((x,i)=>{const b=document.createElement("button");b.className="opt"+(VM?" wait":"");b.innerHTML="<b>"+"ABCD"[i]+":</b>"+x.t;b.style.animationDelay=VM?"0s":(.2+i*.12)+"s";b.onclick=()=>pick(b,x);x.el=b;$("ans").appendChild(b)});

let I=nn===0?INTRO0:nn===5?K.mid:nn===9?K.last:(Math.random()<.3?INTRO[0]:null);if(I&&!avail(I[0]))I=null;if(I)say(I[1]);

(VM?Promise.all([vplay("F06"),new Promise(r=>setTimeout(r,1600))]):new Promise(r=>setTimeout(r,2100))).then(()=>{clearInterval(tickI);if(g!==G)return;b.classList.remove("sel");const c=G.cur.o.find(o=>o.ok);if(x.ok)c.el.classList.add("ok");let r;

if(VM)setTimeout(()=>vplay(r[0]).then(()=>setTimeout(()=>{if(g===G){G.n++;next()}},400)),600);else setTimeout(()=>{G.n++;next()},2200)})}
